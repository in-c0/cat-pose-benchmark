name: CT1 context and routine tests

on:
  pull_request:
    paths:
      - "context/**"
      - "programme/**"
      - "schemas/intent-event.schema.json"
      - ".github/workflows/ct1-context-tests.yml"
  push:
    branches: [main]
    paths:
      - "context/**"
      - "programme/**"
      - "schemas/intent-event.schema.json"
      - ".github/workflows/ct1-context-tests.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CT1 dependencies
        run: python -m pip install --disable-pip-version-check jsonschema scikit-learn
      - name: Run CT1 unit tests
        run: python -m unittest context.test_ct1_features context.test_ct1_baseline context.test_ct1_capture
      - name: Generate deterministic synthetic events
        run: python -m context.fixtures.ct1_synthetic_events --output /tmp/ct1-events.json
      - name: Build synthetic CT1 rows
        run: |
          python -m context.ct1_features \
            /tmp/ct1-events.json \
            --output /tmp/ct1-rows.json
      - name: Run synthetic chronological baseline
        run: |
          python -m context.ct1_baseline \
            /tmp/ct1-events.json \
            --output /tmp/ct1-report.json
          cat /tmp/ct1-report.json
      - name: Validate strict CT1.2 capture contract
        run: |
          python -m context.fixtures.ct1_capture_template --output /tmp/ct1-capture.json
          python -m context.ct1_capture /tmp/ct1-capture.json
          python - <<'PY'
          import json
          from pathlib import Path
          event = json.loads(Path('/tmp/ct1-capture.json').read_text())
          Path('/tmp/ct1-capture-events.json').write_text(json.dumps([event]))
          PY
          python -m context.ct1_strict_features \
            /tmp/ct1-capture-events.json \
            --output /tmp/ct1-capture-rows.json
