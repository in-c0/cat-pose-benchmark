name: Anchored tail rules

on:
  workflow_dispatch:
  push:
    paths:
      - "detail/anchored_tail.py"
      - "detail/test_anchored_tail.py"
      - "detail/mask_centerline.py"
      - ".github/workflows/anchored-tail-tests.yml"
  pull_request:
    paths:
      - "detail/anchored_tail.py"
      - "detail/test_anchored_tail.py"
      - "detail/mask_centerline.py"
      - ".github/workflows/anchored-tail-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy pillow scikit-image opencv-python-headless
      - name: Run rule tests without SAM2
        run: python -m pytest -q detail/test_anchored_tail.py detail/test_mask_centerline.py
