name: Held-out Domestic catfight screen

on:
  workflow_dispatch:
  push:
    paths:
      - "bakeoff/clips/commons-domestic-catfight.json"
      - "bakeoff/materialize_clip.py"
      - ".github/workflows/domestic-catfight-heldout-screen.yml"

permissions:
  contents: read

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install lightweight media tools
        run: python -m pip install --disable-pip-version-check pillow imageio-ffmpeg

      - name: Materialize licence-approved dynamic held-out clip
        run: |
          set -o pipefail
          python -m bakeoff.materialize_clip bakeoff/clips/commons-domestic-catfight.json \
            | tee /tmp/materialized.json

      - name: Extract one-frame-per-second downsampled screen
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          mkdir -p /tmp/domestic-catfight-screen/frames
          "$FFMPEG" -hide_banner -loglevel error -y \
            -i bakeoff/media/domestic-catfight.webm \
            -vf "fps=1,scale=640:-2" \
            -q:v 2 -start_number 0 \
            /tmp/domestic-catfight-screen/frames/%05d.jpg

      - name: Build labelled contact sheets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import math

          frames = sorted(Path('/tmp/domestic-catfight-screen/frames').glob('*.jpg'))
          assert 37 <= len(frames) <= 39, len(frames)
          thumb_w = 320
          first = Image.open(frames[0]).convert('RGB')
          thumb_h = round(thumb_w * first.height / first.width)
          per_sheet = 20
          cols = 5
          for sheet_index, start in enumerate(range(0, len(frames), per_sheet)):
              subset = frames[start:start + per_sheet]
              rows = math.ceil(len(subset) / cols)
              sheet = Image.new('RGB', (cols * thumb_w, rows * thumb_h), 'black')
              for offset, path in enumerate(subset):
                  source_index = start + offset
                  image = Image.open(path).convert('RGB').resize((thumb_w, thumb_h))
                  draw = ImageDraw.Draw(image)
                  draw.rectangle((5, 5, 116, 30), fill='black')
                  draw.text((10, 10), f'{source_index:02d}s / f{source_index}', fill='white')
                  x = (offset % cols) * thumb_w
                  y = (offset // cols) * thumb_h
                  sheet.paste(image, (x, y))
              sheet.save(f'/tmp/domestic-catfight-screen/contact-sheet-{sheet_index}.jpg', quality=92)
          print('screen frames', len(frames))
          PY

      - name: Upload dynamic held-out screening evidence
        uses: actions/upload-artifact@v4
        with:
          name: domestic-catfight-heldout-screen
          path: |
            /tmp/materialized.json
            /tmp/domestic-catfight-screen/contact-sheet-*.jpg
            /tmp/domestic-catfight-screen/frames/*.jpg
