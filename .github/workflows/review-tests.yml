name: Human frame review tooling

on:
  workflow_dispatch:
  push:
    paths:
      - "review/**"
      - ".github/workflows/review-tests.yml"
  pull_request:
    paths:
      - "review/**"
      - ".github/workflows/review-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run scorer and template tests
        run: python -m pytest -q review
