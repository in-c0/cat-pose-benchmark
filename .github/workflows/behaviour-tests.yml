name: BH1 behaviour feasibility tooling

on:
  workflow_dispatch:
  push:
    paths:
      - "behaviour/**"
      - "review/hr1/**"
      - "review/holdout/sample_pool.py"
      - ".github/workflows/behaviour-tests.yml"
  pull_request:
    paths:
      - "behaviour/**"
      - "review/hr1/**"
      - "review/holdout/sample_pool.py"
      - ".github/workflows/behaviour-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy scikit-learn pillow requests
      - name: Run BH1 tests (synthetic data only)
        run: python -m pytest -q behaviour
      - name: Check withholding
        run: python -m behaviour.withholding
