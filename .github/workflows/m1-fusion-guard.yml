name: M1 fusion result guard

on:
  pull_request:
    paths:
      - "fusion/**"
      - "context/**"
      - "programme/**"
      - "schemas/intent-event.schema.json"
      - ".github/workflows/m1-fusion-guard.yml"
  push:
    branches: [main]
    paths:
      - "fusion/**"
      - "context/**"
      - "programme/**"
      - "schemas/intent-event.schema.json"
      - ".github/workflows/m1-fusion-guard.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install M1 integration dependencies
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Run M1 guard, cohort and sidecar tests
        run: python -m unittest fusion.test_m1_result_guard fusion.test_m1_cohort_manifest fusion.test_m1_sensor_sidecar
      - name: Generate complete synthetic M1 report
        run: python -m fusion.fixtures.m1_synthetic_report --output /tmp/m1-report.json
      - name: Validate complete synthetic M1 report
        run: |
          python -m fusion.m1_result_guard \
            /tmp/m1-report.json \
            --summary /tmp/m1-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('/tmp/m1-summary.json').read_text())
          assert summary['contract_valid'] is True
          assert summary['advancement_eligible'] is True
          print('M1 complete synthetic report passed frozen result contract')
          PY
      - name: Prove omitted ablation fails closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/m1-report.json').read_text())
          report['rows'] = [row for row in report['rows'] if row['id'] != 'A']
          Path('/tmp/m1-invalid.json').write_text(json.dumps(report))
          PY
          if python -m fusion.m1_result_guard /tmp/m1-invalid.json; then
            echo "ERROR: invalid M1 report unexpectedly passed"
            exit 1
          else
            echo "M1 guard correctly rejected omitted ablation"
          fi
      - name: Build synthetic M1.2 shared cohort manifest
        run: |
          python -m fusion.fixtures.m1_cohort_events --output /tmp/m1-events.json
          python -m fusion.m1_cohort_manifest \
            /tmp/m1-events.json \
            --output /tmp/m1-cohort.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/m1-cohort.json').read_text())
          assert manifest['performance_analysis_performed'] is False
          assert manifest['support_counts']['events_received'] == 7
          assert manifest['support_counts']['primary_complete_case_labelled'] == 2
          expected = manifest['primary_episode_ids']
          assert len(expected) == 2
          for row_id, episode_ids in manifest['ablation_episode_ids'].items():
              assert episode_ids == expected, (row_id, episode_ids, expected)
          print('M1.2 shared-cohort manifest stayed performance-blind and cohort-identical')
          PY
      - name: Smoke-test immutable M1.3 sensor composition
        run: |
          python - <<'PY'
          import json
          import tempfile
          import wave
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from context.ct1_capture_cli import build_started_event, build_lock, finalize_event
          from fusion.m1_sensor_sidecar import build_reservation, seal_sidecar, compose_enriched_event
          from fusion.m1_cohort_manifest import build_manifest
          from fusion.v1_pose_package import POSE_PACKAGE_SCHEMA_REF

          root = Path(tempfile.mkdtemp(prefix='m1-sidecar-ci-'))
          wav = root / 'cat.wav'
          pose = root / 'pose.json'
          with wave.open(str(wav), 'wb') as handle:
              handle.setnchannels(1)
              handle.setsampwidth(2)
              handle.setframerate(8000)
              handle.writeframes(b'\x00\x00' * 40000)

          started = datetime(2026, 8, 21, 8, 0, tzinfo=timezone.utc)
          event = build_started_event(
              context={'location':'hallway','objects':[],'social':[],'environment':{'synthetic':True}},
              subject_id='synthetic-cat', household_id='synthetic-household',
              session_id='synthetic-session', event_id='synthetic-sidecar-smoke',
              started_at=started, clock_uncertainty_ms=10,
          )
          lock = build_lock(event)
          pose.write_text(json.dumps({
              'package_version': 'V1-M1-pose-package-v0',
              'event_id': event['event_id'],
              'episode_id': event['episode_id'],
              'sequence_id': 'synthetic-v1-sequence',
              'subject_id': event['subject_id'],
              'evidence_window_ms': {'start_offset_ms': 0, 'end_offset_ms': 5000},
              'producer': {
                  'kind': 'learned_model',
                  'name': 'synthetic-ci-producer',
                  'version': '0.0-test',
                  'model_family': 'synthetic-ci-family',
                  'weights_sha256': 'b' * 64,
                  'code_revision': 'synthetic-ci',
              },
              'source_media': [{
                  'record_id': 'synthetic-video-record',
                  'sha256': 'a' * 64,
                  'media_type': 'video/webm',
                  'width_px': 640,
                  'height_px': 480,
                  'frame_rate_hz': 30.0,
              }],
              'samples': [{
                  'event_offset_ms': 0,
                  'frame_index': 0,
                  'observations': [{
                      'observation_id': 'synthetic-frame-000-nose',
                      'sequence_id': 'synthetic-v1-sequence',
                      'frame_index': 0,
                      'subject_id': event['subject_id'],
                      'observation_class': 'surface_landmark',
                      'semantic_name': 'nose',
                      'coordinate_space': 'image',
                      'units': 'pixels',
                      'mean': [100.0, 80.0],
                      'covariance': [[4.0, 0.0], [0.0, 4.0]],
                      'visibility': ['visible'],
                      'evidence_tier': 'S2',
                      'quality': 'bronze',
                      'source_ids': ['synthetic-video-record'],
                      'lineage': ['synthetic-ci-producer'],
                  }],
              }],
          }))

          audio = seal_sidecar(build_reservation(
              event, lock, modality='audio_vocalisation',
              schema_ref='audio/A1-naturalistic-wav-v0', human_content='none',
              reserved_at=started + timedelta(milliseconds=100),
          ), wav)
          visual = seal_sidecar(build_reservation(
              event, lock, modality='visual_pose',
              schema_ref=POSE_PACKAGE_SCHEMA_REF, human_content='none',
              reserved_at=started + timedelta(milliseconds=200),
          ), pose)
          assert visual['seal']['media_metadata']['package_version'] == 'V1-M1-pose-package-v0'
          assert visual['seal']['media_metadata']['observation_count'] == 1
          finalized, final_lock = finalize_event(event, lock, terminated=True)
          base_before = json.dumps(finalized, sort_keys=True)
          enriched = compose_enriched_event(finalized, final_lock, [audio, visual])
          assert json.dumps(finalized, sort_keys=True) == base_before
          row = build_manifest([enriched])['events'][0]
          assert row['primary_cohort_eligible'] is True
          assert row['support']['A1_vocal_audio'] is True
          assert row['support']['V1_visual_pose'] is True
          assert str(wav.resolve()) not in json.dumps(enriched)
          assert str(pose.resolve()) not in json.dumps(enriched)
          print('M1.3 composition requires a provenance-valid V1 pose package and keeps raw paths local')
          PY
