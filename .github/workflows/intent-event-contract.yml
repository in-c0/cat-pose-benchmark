name: Feline intent event contract

on:
  push:
    paths:
      - "schemas/intent-event.schema.json"
      - "docs/INTENT-EVENT-CONTRACT.md"
      - "programme/**"
      - "examples/intent-events/**"
      - ".github/workflows/intent-event-contract.yml"
  pull_request:
    paths:
      - "schemas/intent-event.schema.json"
      - "docs/INTENT-EVENT-CONTRACT.md"
      - "programme/**"
      - "examples/intent-events/**"
      - ".github/workflows/intent-event-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Run schema and semantic validator tests
        run: python -m unittest programme.test_intent_event_schema

      - name: Validate public fixtures individually
        run: |
          python -m programme.validate_intent_event examples/intent-events/pose-only.json
          python -m programme.validate_intent_event examples/intent-events/audio-only.json
          python -m programme.validate_intent_event examples/intent-events/multimodal-intervention.json
