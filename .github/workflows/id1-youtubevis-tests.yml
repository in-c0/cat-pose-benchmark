name: ID1 YouTube-VIS adapter

on:
  push:
    paths:
      - "identity/youtubevis_adapter.py"
      - "identity/youtubevis_archive.py"
      - "identity/test_youtubevis_adapter.py"
      - "identity/test_youtubevis_archive.py"
      - "identity/test_youtubevis_selection_spec.py"
      - "identity/id1_youtubevis_selection_spec.json"
      - "docs/ID1-YOUTUBE-VIS-ADAPTER.md"
      - ".github/workflows/id1-youtubevis-tests.yml"
  pull_request:
    paths:
      - "identity/youtubevis_adapter.py"
      - "identity/youtubevis_archive.py"
      - "identity/test_youtubevis_adapter.py"
      - "identity/test_youtubevis_archive.py"
      - "identity/test_youtubevis_selection_spec.py"
      - "identity/id1_youtubevis_selection_spec.json"
      - "docs/ID1-YOUTUBE-VIS-ADAPTER.md"
      - ".github/workflows/id1-youtubevis-tests.yml"

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight adapter dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow

      - name: Run adapter tests
        run: >-
          python -m unittest -v
          identity.test_youtubevis_adapter
          identity.test_youtubevis_archive
          identity.test_youtubevis_selection_spec

      - name: Validate frozen selection spec
        run: python -m json.tool identity/id1_youtubevis_selection_spec.json >/dev/null

      - name: Compile adapters
        run: python -m py_compile identity/youtubevis_adapter.py identity/youtubevis_archive.py

  monitor-quantitative:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_SHA: 3e0d9ec44a088bbf56d15486f2be24b92f65dcc8
      TARGET_WORKFLOW_NAME: ID1 YouTube-VIS quantitative REMIND
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve target push run
        id: target
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 40); do
            run_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f head_sha="$TARGET_SHA" -f event=push -f per_page=100 \
              --jq ".workflow_runs[] | select(.name == \"$TARGET_WORKFLOW_NAME\") | .id" \
              | head -n1 || true)"
            if [ -n "$run_id" ]; then break; fi
            echo "target run not visible yet (attempt $attempt)"
            sleep 15
          done
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "quantitative run=$run_id"

      - name: Follow quantitative run
        id: follow
        run: |
          set -euo pipefail
          run_id="${{ steps.target.outputs.run_id }}"
          for attempt in $(seq 1 360); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            status="$(jq -r '.status' <<<"$payload")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$payload")"
            echo "attempt=$attempt status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          exit 1

      - name: Download successful quantitative evidence
        if: steps.follow.outputs.conclusion == 'success'
        run: |
          mkdir -p monitor-artifact
          gh run download "${{ steps.target.outputs.run_id }}" \
            --repo "$GITHUB_REPOSITORY" \
            --name id1-youtubevis-quantitative \
            --dir monitor-artifact

      - name: Summarize successful result
        if: steps.follow.outputs.conclusion == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('monitor-artifact')
          def one(name):
              hits = list(root.rglob(name))
              if len(hits) != 1:
                  raise SystemExit(f'expected one {name}, found {len(hits)}')
              return hits[0]
          result = json.loads(one('id1-result.json').read_text(encoding='utf-8'))
          selection = json.loads(one('selection.json').read_text(encoding='utf-8'))
          m = result['metrics']
          s = selection['selected']
          lines = [
              '## ID1.2 quantitative REMIND result', '',
              f"Workflow run: `${{ steps.target.outputs.run_id }}`",
              f"Selected YouTube-VIS video: **{s['video_id']}**",
              f"Cat instances: **{s['cat_instance_count']}**; co-visible frames: **{s['co_visible_frames']}**; max internal gap: **{s['max_internal_gap_frames']}**; bbox-overlap frames: **{s['bbox_overlap_frames']}**", '',
              '### Frozen metrics', '',
              f"- IDF1: **{m.get('idf1')}**",
              f"- ID switches: **{m.get('idsw')}**",
              f"- Fragmentations: **{m.get('frag')}**",
              f"- Tracking recall: **{m.get('tracking_recall')}**",
              f"- Reopen rate: **{m.get('reopen_rate_existing')}**",
              f"- Recovered-reference objects: **{m.get('objects_recovered_reference')}**",
              f"- Firm coverage: **{m.get('coverage_firm')}**",
              f"- Firm accuracy: **{m.get('firm_accuracy')}**",
              f"- Uncertain rate: **{m.get('uncertain_rate')}**",
              f"- Total runtime: **{m.get('total_runtime_seconds')} s**",
              f"- Avg loop: **{m.get('avg_loop_ms')} ms**", '',
              'Source masks were used as detections: this is identity association/ReID performance, not end-to-end detector accuracy or an intent/translation/health result.'
          ]
          Path('monitor-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(Path('monitor-summary.md').read_text(encoding='utf-8'))
          PY

      - name: Summarize failed result
        if: steps.follow.outputs.conclusion != 'success'
        run: |
          run_id="${{ steps.target.outputs.run_id }}"
          {
            echo '## ID1.2 quantitative REMIND run failed'
            echo
            echo "Workflow run: \`$run_id\`"
            echo "Conclusion: \`${{ steps.follow.outputs.conclusion }}\`"
            echo
            echo '```text'
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 180 || true
            echo '```'
          } > monitor-summary.md
          cat monitor-summary.md

      - name: Comment result on PR
        if: always()
        run: |
          test -f monitor-summary.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file monitor-summary.md

      - name: Match target conclusion
        if: steps.follow.outputs.conclusion != 'success'
        run: exit 1
