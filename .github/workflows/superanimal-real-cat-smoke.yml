name: SuperAnimal real-cat smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "bakeoff/adapters/deeplabcut_common.py"
      - "bakeoff/adapters/superanimal_quadruped.py"
      - "bakeoff/materialize_clip.py"
      - "bakeoff/clips/commons-cat-plays.json"
      - "bakeoff/prediction.schema.json"
      - "bakeoff/evaluate.py"
      - ".github/workflows/superanimal-real-cat-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch and DeepLabCut
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==2.4.1" "torchvision==0.19.1" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "deeplabcut==3.0.1" jsonschema

      - name: Report resolved versions
        run: |
          python - <<'PY'
          import deeplabcut, numpy, pandas, torch, torchvision
          print("deeplabcut", deeplabcut.__version__)
          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("torch", torch.__version__)
          print("torchvision", torchvision.__version__)
          PY

      - name: Materialize licence-approved cat clip
        run: |
          python -m bakeoff.materialize_clip bakeoff/clips/commons-cat-plays.json \
            | tee /tmp/materialized.json

      - name: Make compact smoke clip and manifest
        run: |
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$FFMPEG" -hide_banner -loglevel error -y \
            -i bakeoff/media/cat-plays.webm \
            -t 2.0 -vf fps=4 -an /tmp/cat-plays-superanimal-smoke.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("bakeoff/clips/commons-cat-plays.json").read_text())
          manifest["clip_id"] = "commons-cat-plays-superanimal-smoke"
          manifest["source"]["local_path"] = "/tmp/cat-plays-superanimal-smoke.mp4"
          Path("/tmp/superanimal-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Run SuperAnimal-Quadruped
        run: |
          python -m bakeoff.adapters.superanimal_quadruped \
            --clip /tmp/superanimal-manifest.json \
            --output /tmp/superanimal-prediction.json \
            --device cpu \
            --batch-size 1

      - name: Validate and evaluate prediction
        run: |
          python -m bakeoff.validate \
            /tmp/superanimal-prediction.json \
            bakeoff/prediction.schema.json
          python -m bakeoff.evaluate \
            /tmp/superanimal-prediction.json \
            --requirements bakeoff/feline-requirements.json \
            --output /tmp/superanimal-report.json
          cat /tmp/superanimal-report.json

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superanimal-real-cat-smoke
          if-no-files-found: warn
          path: |
            /tmp/materialized.json
            /tmp/superanimal-manifest.json
            /tmp/superanimal-prediction.json
            /tmp/superanimal-report.json
