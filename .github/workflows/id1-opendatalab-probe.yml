name: ID1 OpenDataLab access probe

on:
  push:
    branches:
      - "identity/id1-opendatalab-probe"
    paths:
      - ".github/workflows/id1-opendatalab-probe.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/id1-opendatalab-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OpenXLab SDK
        run: python -m pip install --disable-pip-version-check openxlab

      - name: Probe public dataset metadata without credentials
        id: probe
        continue-on-error: true
        run: |
          python - <<'PY' 2>&1 | tee opendatalab-probe.log
          import json
          import os
          from pathlib import Path
          from openxlab.dataset import info, query, download

          repo = "OpenDataLab/YouTubeVIS2019"
          print("repo=", repo)
          print("OPENXLAB_AK_present=", bool(os.getenv("OPENXLAB_AK")))
          print("OPENXLAB_SK_present=", bool(os.getenv("OPENXLAB_SK")))
          for name, fn in (("info", info), ("query", query)):
              print(f"--- {name} ---")
              try:
                  result = fn(dataset_repo=repo)
                  try:
                      print(json.dumps(result, ensure_ascii=False, default=str, indent=2))
                  except Exception:
                      print(repr(result))
              except Exception as exc:
                  print(type(exc).__name__ + ": " + str(exc))

          print("--- anonymous README download ---")
          target = Path("odl-download")
          target.mkdir(exist_ok=True)
          try:
              result = download(
                  dataset_repo=repo,
                  source_path="/README.md",
                  target_path=str(target),
              )
              print("download_result=", repr(result))
              for path in sorted(target.rglob("*")):
                  if path.is_file():
                      print("downloaded_file=", path, "bytes=", path.stat().st_size)
                      print(path.read_text(encoding="utf-8", errors="replace")[:1000])
          except Exception as exc:
              print("download_error=", type(exc).__name__ + ": " + str(exc))
          PY

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: id1-opendatalab-probe
          path: |
            opendatalab-probe.log
            odl-download/
          if-no-files-found: warn
          retention-days: 7
