name: A1 audio tests

on:
  push:
    paths:
      - "audio/**"
      - "fusion/m1_sensor_sidecar.py"
      - "fusion/m1_cohort_manifest.py"
      - "context/**"
      - "programme/**"
      - "schemas/intent-event.schema.json"
      - "scripts/start-h0-capture.ps1"
      - ".gitignore"
      - ".github/workflows/audio-a1-tests.yml"
  pull_request:
    paths:
      - "audio/**"
      - "fusion/m1_sensor_sidecar.py"
      - "fusion/m1_cohort_manifest.py"
      - "context/**"
      - "programme/**"
      - "schemas/intent-event.schema.json"
      - "scripts/start-h0-capture.ps1"
      - ".gitignore"
      - ".github/workflows/audio-a1-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install A1 dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy librosa scikit-learn jsonschema

      - name: Run A1 unit tests
        run: python -m unittest discover -s audio -p 'test_*.py'

      - name: Check capture-station JavaScript syntax
        run: |
          node --check audio/capture_station/app.js
          node --check audio/capture_station/recorder-worklet.js

      - name: Parse H0 PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/start-h0-capture.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
