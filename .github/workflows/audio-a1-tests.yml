name: A1 audio tests

on:
  push:
    paths:
      - "audio/**"
      - ".github/workflows/audio-a1-tests.yml"
  pull_request:
    paths:
      - "audio/**"
      - ".github/workflows/audio-a1-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install acoustic baseline dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy librosa scikit-learn

      - name: Run A1 unit tests
        run: python -m unittest discover -s audio -p 'test_*.py'
