name: RTMPose real-cat smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "bakeoff/adapters/rtmpose_animal.py"
      - "bakeoff/materialize_clip.py"
      - "bakeoff/clips/commons-cat-plays.json"
      - "bakeoff/prediction.schema.json"
      - "bakeoff/evaluate.py"
      - ".github/workflows/rtmpose-real-cat-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install CPU PyTorch and OpenMMLab stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.4" "torch==2.0.1" "torchvision==0.15.2" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            "numpy==1.26.4" \
            "opencv-python==4.10.0.84" \
            "openmim>=0.3.9,<0.4" \
            jsonschema
          mim install "mmengine>=0.9.0,<1.0.0"
          mim install "mmcv==2.1.0"
          mim install "mmdet==3.2.0"
          # MMPose 1.3.2 still depends on chumpy 0.70. Its legacy setup imports pip
          # during wheel requirement discovery, which fails in modern isolated builds.
          python -m pip install --no-build-isolation "chumpy==0.70"
          mim install "mmpose==1.3.2"
          # Guard against transitive packages replacing the NumPy/OpenCV pair after MIM.
          python -m pip install "numpy==1.26.4" "opencv-python==4.10.0.84"

      - name: Report resolved versions
        run: |
          python - <<'PY'
          import cv2, mmcv, mmengine, mmdet, mmpose, numpy, torch
          print("numpy", numpy.__version__)
          print("opencv", cv2.__version__)
          print("torch", torch.__version__)
          print("mmcv", mmcv.__version__)
          print("mmengine", mmengine.__version__)
          print("mmdet", mmdet.__version__)
          print("mmpose", mmpose.__version__)
          PY

      - name: Materialize licence-approved cat clip
        run: |
          python -m bakeoff.materialize_clip bakeoff/clips/commons-cat-plays.json \
            | tee /tmp/materialized.json

      - name: Run RTMPose Animal on eight sampled frames
        run: |
          python -m bakeoff.adapters.rtmpose_animal \
            --clip bakeoff/clips/commons-cat-plays.json \
            --output /tmp/rtmpose-prediction.json \
            --device cpu \
            --stride 15 \
            --max-frames 8

      - name: Validate and evaluate prediction
        run: |
          python -m bakeoff.validate \
            /tmp/rtmpose-prediction.json \
            bakeoff/prediction.schema.json
          python -m bakeoff.evaluate \
            /tmp/rtmpose-prediction.json \
            --requirements bakeoff/feline-requirements.json \
            --output /tmp/rtmpose-report.json
          cat /tmp/rtmpose-report.json

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rtmpose-real-cat-smoke
          if-no-files-found: warn
          path: |
            /tmp/materialized.json
            /tmp/rtmpose-prediction.json
            /tmp/rtmpose-report.json
