name: Feline detail geometry

on:
  push:
    paths:
      - "detail/**"
      - ".github/workflows/feline-detail-tests.yml"
  pull_request:
    paths:
      - "detail/**"
      - ".github/workflows/feline-detail-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install lightweight dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            jsonschema \
            numpy \
            pillow \
            scikit-image

      - name: Run feline detail tests
        run: python -m unittest discover -s detail -p 'test_*.py'

      - name: Evaluate deterministic fixture
        run: |
          python -m detail.evaluate \
            detail/fixtures/reference.json \
            detail/fixtures/prediction.json \
            --output /tmp/detail-report.json
          cat /tmp/detail-report.json
