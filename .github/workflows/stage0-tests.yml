name: Stage 0 geometry tests

on:
  push:
    paths:
      - "stage0/**"
      - "unity-viewer/**"
      - ".github/workflows/stage0-tests.yml"
  pull_request:
    paths:
      - "stage0/**"
      - "unity-viewer/**"
      - ".github/workflows/stage0-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run unit tests
        run: python -m unittest stage0.test_geometry_sim

      - name: Regenerate nominal report
        run: |
          python stage0/geometry_sim.py \
            --config stage0/layouts.json \
            --output /tmp/geometry-conditioning-report.json

      - name: Verify committed report is reproducible
        run: |
          python stage0/compare_reports.py \
            stage0/geometry-conditioning-report.json \
            /tmp/geometry-conditioning-report.json \
            --abs-tol 1e-8 \
            --rel-tol 1e-10

      - name: Regenerate Unity data contract
        run: |
          python -m stage0.export_unity_config \
            --layouts stage0/layouts.json \
            --report stage0/geometry-conditioning-report.json \
            --output /tmp/stage0-layouts.json

      - name: Verify Unity data contract is reproducible
        run: |
          python stage0/compare_reports.py \
            unity-viewer/Assets/StreamingAssets/CatPose/stage0-layouts.json \
            /tmp/stage0-layouts.json \
            --abs-tol 1e-8 \
            --rel-tol 1e-10
