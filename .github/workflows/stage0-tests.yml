name: Stage 0 and S0 tests

on:
  push:
    paths:
      - "stage0/**"
      - "synthetic/**"
      - "schemas/observation.schema.json"
      - "schemas/synthetic-sequence.schema.json"
      - "schemas/stage0-capture-manifest.schema.json"
      - ".github/workflows/stage0-tests.yml"
  pull_request:
    paths:
      - "stage0/**"
      - "synthetic/**"
      - "schemas/observation.schema.json"
      - "schemas/synthetic-sequence.schema.json"
      - "schemas/stage0-capture-manifest.schema.json"
      - ".github/workflows/stage0-tests.yml"

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check numpy

      - name: Run geometry and hardware unit tests
        run: |
          python -m unittest \
            stage0.test_geometry_sim \
            stage0.test_hardware_feasibility \
            stage0.test_capture_host_probe

      - name: Regenerate nominal geometry report
        run: |
          python stage0/geometry_sim.py \
            --config stage0/layouts.json \
            --output /tmp/geometry-conditioning-report.json

      - name: Verify committed geometry report is reproducible
        run: |
          python stage0/compare_reports.py \
            stage0/geometry-conditioning-report.json \
            /tmp/geometry-conditioning-report.json \
            --abs-tol 1e-8 \
            --rel-tol 1e-10

      - name: Regenerate hardware feasibility report
        run: |
          python -m stage0.hardware_feasibility \
            --config stage0/hardware_candidates.json \
            --output /tmp/hardware-feasibility-report.json

      - name: Verify committed hardware report is reproducible
        run: |
          python stage0/compare_reports.py \
            stage0/hardware-feasibility-report.json \
            /tmp/hardware-feasibility-report.json \
            --abs-tol 1e-8 \
            --rel-tol 1e-10

  schemas-target-and-synthetic:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            jsonschema \
            numpy \
            opencv-contrib-python-headless \
            pillow

      - name: Test target, manifest, and synthetic tools
        run: |
          python -m unittest \
            stage0.test_target_generator \
            stage0.test_capture_manifest \
            synthetic.test_validate_sequence

      - name: Generate low-resolution target dry run
        run: |
          python stage0/generate_target.py \
            --output-dir /tmp/catpose-target \
            --dpi 72

      - name: Validate example capture manifest
        run: |
          python stage0/validate_capture_manifest.py \
            stage0/example-capture-manifest.json
