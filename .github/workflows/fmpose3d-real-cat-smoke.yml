name: FMPose3D real-cat smoke

on:
  workflow_dispatch:
  push:
    paths:
      - "bakeoff/adapters/deeplabcut_common.py"
      - "bakeoff/adapters/fmpose3d_animal.py"
      - "bakeoff/materialize_clip.py"
      - "bakeoff/clips/commons-cat-plays.json"
      - "bakeoff/prediction.schema.json"
      - "bakeoff/evaluate.py"
      - ".github/workflows/fmpose3d-real-cat-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch, DeepLabCut and FMPose3D
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "torch==2.4.1" "torchvision==0.19.1" \
            --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "deeplabcut[fmpose3d]==3.0.1" jsonschema

      - name: Report resolved versions
        run: |
          python - <<'PY'
          import deeplabcut, fmpose3d, numpy, pandas, torch, torchvision
          print("deeplabcut", deeplabcut.__version__)
          print("fmpose3d", getattr(fmpose3d, "__version__", "unknown"))
          print("numpy", numpy.__version__)
          print("pandas", pandas.__version__)
          print("torch", torch.__version__)
          print("torchvision", torchvision.__version__)
          print("cuda available", torch.cuda.is_available())
          PY

      - name: Materialize licence-approved cat clip
        run: |
          python -m bakeoff.materialize_clip bakeoff/clips/commons-cat-plays.json \
            | tee /tmp/materialized.json

      - name: Make four-frame smoke clip and manifest
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -i bakeoff/media/cat-plays.webm \
            -t 1.0 -vf fps=4 -an /tmp/cat-plays-fmpose3d-smoke.mp4
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("bakeoff/clips/commons-cat-plays.json").read_text())
          manifest["clip_id"] = "commons-cat-plays-fmpose3d-smoke"
          manifest["source"]["local_path"] = "/tmp/cat-plays-fmpose3d-smoke.mp4"
          Path("/tmp/fmpose3d-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Run FMPose3D Animals
        run: |
          python -m bakeoff.adapters.fmpose3d_animal \
            --clip /tmp/fmpose3d-manifest.json \
            --output /tmp/fmpose3d-prediction.json \
            --device cpu \
            --batch-size 4

      - name: Validate and evaluate prediction
        run: |
          python -m bakeoff.validate \
            /tmp/fmpose3d-prediction.json \
            bakeoff/prediction.schema.json
          python -m bakeoff.evaluate \
            /tmp/fmpose3d-prediction.json \
            --requirements bakeoff/feline-requirements.json \
            --output /tmp/fmpose3d-report.json
          cat /tmp/fmpose3d-report.json

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmpose3d-real-cat-smoke
          if-no-files-found: warn
          path: |
            /tmp/materialized.json
            /tmp/fmpose3d-manifest.json
            /tmp/fmpose3d-prediction.json
            /tmp/fmpose3d-report.json
